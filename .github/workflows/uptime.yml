name: Uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check production routes
        run: |
          set -euo pipefail
          for path in / /orders /api/openapi /api/auth/ok; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://weft-erp.vercel.app${path}")
            echo "${path}: ${code}"
            if [ "$code" -lt 200 ] || [ "$code" -ge 500 ]; then
              exit 1
            fi
          done
